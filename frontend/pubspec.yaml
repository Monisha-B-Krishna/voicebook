name: voicebook
description: Voice AI inventory & booking assistant for tent house businesses (Kannada).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.2

  # Audio recording / playback
  record: ^7.1.1
  audioplayers: ^6.0.0
  permission_handler: ^11.3.0

  # Local notifications (booking reminders)
  flutter_local_notifications: ^17.1.2

  # Local offline database (optional sync cache)
  sqflite: ^2.3.3
  path_provider: ^2.1.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/
